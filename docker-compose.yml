services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    # GPU passthrough disabled — runs on CPU. To re-enable later (after
    # installing the NVIDIA Container Toolkit on the host), add back:
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: all
    #             capabilities: [gpu]
    restart: unless-stopped

  # One-shot job: pulls the LLM + embedding models into the ollama_models
  # volume, then exits. "app" waits for this to succeed before starting so
  # the first chat request never hits a "model not found" error.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    # Retry loop: right after "ollama" reports healthy, its name can still take
    # a moment to propagate in Docker's embedded DNS (127.0.0.11), which makes
    # the first pull attempt fail with "server misbehaving". Retry instead of
    # failing the whole stack on that transient race.
    command: >
      "for i in $$(seq 1 30); do
         ollama pull \"$$LLM_MODEL\" && ollama pull \"$$EMBEDDING_MODEL\" && exit 0
         echo \"[ollama-init] pull failed, retrying in 3s ($$i/30)...\"
         sleep 3
       done
       exit 1"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - model_cache:/root/.cache
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_models:
  model_cache:
